name: Release

# Runs only when a maintainer pushes a version tag (for example v1.0.0). Pushing the tag is the explicit
# authorization to publish; nothing else in the repository publishes packages.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    uses: ./.github/workflows/verify.yaml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      ContinuousIntegrationBuild: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check that the tag matches the version in Directory.Build.props
        shell: bash
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Check that every PublicAPI.Unshipped.txt is empty
        shell: bash
        run: |
          for file in src/*/PublicAPI.Unshipped.txt; do
            if grep -q -v -e '^#' -e '^$' "$file"; then echo "Unshipped API remains in $file"; exit 1; fi
          done

      - name: Pack
        run: dotnet pack Touchstone.slnx -c Release -o artifacts/packages

      - name: Push to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then echo "NUGET_API_KEY is not configured; skipping push."; exit 0; fi
          dotnet nuget push "artifacts/packages/*.nupkg" -s https://api.nuget.org/v3/index.json -k "$NUGET_API_KEY" --skip-duplicate

      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          awk -v tag="## [v$VERSION]" 'index($0, tag) == 1 {found = 1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for v$VERSION"; exit 1; }

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/packages/* --title "${GITHUB_REF_NAME}" --notes-file release-notes.md

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages
